function issueUrl(labels,entry){
 const url=new URL('https://github.com/jameslyu916-source/WotaWazaDB/issues/new');
 url.searchParams.set('title',(entry?labels[1]+' · '+entry.name:labels[0]+' · '));
 url.searchParams.set('body',[entry?entry.id+' · '+entry.name:'',entry?labels[5]:labels[3],labels[4]].filter(Boolean).join('\n\n'));
 return url.href;
}
const archiveDate=entries.reduce((latest,e)=>e.status==='approved' && e.updated>latest ? e.updated : latest,'');
const archiveLabels={zh:'技库最后更新',ja:'技アーカイブ最終更新',en:'Archive last updated'};

 zh:['排序','默认顺序','最近更新','技名'],
 ja:['並べ替え','標準','更新日が新しい順','技名順'],
 en:['Sort by','Default order','Recently updated','Waza name']
};
function render(){
 const lang=picker.value,u=ui[lang],intro=u[0]+(review?' · '+u[1]:'');
 const [sortLabel,...options]=sortLabels[lang];
 document.querySelector('#sort-label').textContent=sortLabel;
 options.forEach((label,i)=>{sortPicker.options[i].textContent=label});
 const meta=document.querySelector('#archive-meta');
 if(!review && archiveDate){
   meta.hidden=false;
   meta.querySelector('span').textContent=archiveLabels[lang];
   const time=meta.querySelector('time');
   time.dateTime=archiveDate;
   time.textContent=archiveDate;
 }
 const labels=actions[lang],submit=document.querySelector('#submit');
 submit.textContent=labels[0];submit.href=issueUrl(labels);
 document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title='WazaDB · '+intro;
 document.querySelector('#intro').textContent=intro;q.placeholder=u[2];q.setAttribute('aria-label',u[2]);
 const box=document.querySelector('#list'),opened=new Set([...box.querySelectorAll('details[open]')].map(d=>d.id));box.replaceChildren();
 const term=norm(q.value.trim());
 const rows=entries.filter(e=>[e.name,e.reading,...e.aliases,...e.creators].filter(Boolean).some(v=>norm(v).includes(term)));
 if(sortPicker.value==='updated') rows.sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
 if(sortPicker.value==='name'){
   const collator=new Intl.Collator(lang,{numeric:true});
   rows.sort((a,b)=>collator.compare(a.name,b.name));
