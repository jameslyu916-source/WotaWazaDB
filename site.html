<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WotaWazaDB · 技档案</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f3ed;color:#242723;font:16px/1.65 system-ui,sans-serif}main{max-width:960px;margin:auto;padding:35px 5vw 80px}header{border-top:5px solid #d65325;padding:20px 0}h1{font:700 clamp(32px,6vw,58px)/1.1 Georgia,serif;margin:8px 0}header p{margin:8px 0;color:#5e6259}input{width:100%;font:inherit;padding:12px 16px;border:1px solid #aaa99d;border-radius:6px;background:white}details{border-top:1px solid #c9c8be;background:#fcfbf6;padding:14px 18px}summary{cursor:pointer}strong{font-size:20px;margin-right:1em}small{color:#595d53}a{color:#874019}p{margin:9px 0}li{margin:4px 0}ul{padding-left:22px}#count{font-size:14px;margin:18px 0 8px}code{overflow-wrap:anywhere}
nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 24px}nav label{display:flex;align-items:center;gap:6px;font-size:14px}nav select{background:transparent;color:inherit;border:1px solid #8888;padding:5px}header>select{float:none}
body[data-style="folio"]{background:#f5f2e9;color:#282521}body[data-style="folio"] header{border-top:1px solid;padding-top:28px}body[data-style="folio"] h1{font-weight:400;letter-spacing:-.045em}body[data-style="folio"] details{background:transparent;padding:14px 0}body[data-style="folio"] strong{font:600 21px Georgia,serif}
body[data-style="studio"]{background:#17191c;color:#e9e8e1}body[data-style="studio"] header{border-color:#ff9254}body[data-style="studio"] h1{font-family:system-ui;letter-spacing:-.06em}body[data-style="studio"] details,body[data-style="studio"] input,body[data-style="studio"] select{background:#202328;color:#f1eee6}body[data-style="studio"] small,body[data-style="studio"] header p{color:#bac0c4}body[data-style="studio"] a{color:#ffab79}
body[data-style="index"]{background:white;color:#152b51}body[data-style="index"] header{border-top:3px solid #243e66}body[data-style="index"] h1{font:600 clamp(34px,7vw,66px)/1.1 system-ui;letter-spacing:-.055em}body[data-style="index"] details{background:white;border-color:#c5cfdf}body[data-style="index"] summary small{font-family:monospace}body[data-style="index"] a{color:#214b89}
</style>
<body data-style="studio"><main><nav><a id="submit"></a><label><span aria-hidden="true">◎</span> Language <select id="lang" aria-label="Language / 言語 / 语言" ><option value="zh">中文</option><option value="ja">日本語</option><option value="en">English</option></select></label></nav><header><h1>WotaWazaDB</h1><p id="intro"></p></header><input id="q" type="search"><p id="count" aria-live="polite"></p><section id="list"></section></main>
<!--DICTIONARIES-->
<script>const entries=/*DATA*/[];
const review='@@MODE@@'==='review';

if(!review && typeof dictionaryRows!=='undefined'){
 const byId=new Map(entries.map(e=>[e.id,e]));
 for(const row of dictionaryRows){
   let e=byId.get(row.target||row.id);
   if(!e){
     e={id:row.id,status:'approved',name:row.name,reading:row.reading,creators:row.creators,aliases:[],videos:[],sources:[],note:'',updated:'2026-11-25'};
     entries.push(e);byId.set(e.id,e);
   }
   e.aliases=[...new Set([...e.aliases,...row.aliases])];
   if(!e.reading)e.reading=row.reading;
   const source=row.id.startsWith('t')?'ヲタ芸タイムズ':'灰机 Wiki';
   if(!e.sources.some(s=>s.url===row.source))e.sources.push({label:source,url:row.source});
   if(row.honke)e.dictionaryHonke=row.honke;
   for(const url of row.videos){
     if(e.videos.some(v=>v.url===url))continue;
     const platform=new URL(url).hostname.replace(/^www\./,'');
     e.videos.push({label:source+' · '+platform,url});
   }
 }
}
const ui={
 zh:['WOTA 艺技档案','审核预览','搜索技名、别名、读音或作成者','条记录','没有找到匹配的技','暂无已审核条目','作成者待考','视频投稿','作成日期','待审核','已收录','条目更新','补充待审'],
 ja:['ヲタ芸の技アーカイブ','確認用プレビュー','技名・別名・読み・作者で検索','件','該当する技が見つかりません','確認済みの技はまだありません','作者未確認','動画投稿日','制作日','確認待ち','収録済み','項目更新','追加候補'],
 en:['Wotagei waza archive','Review preview','Search by waza, alias, reading or creator','entries','No matching waza','No approved entries yet','Creator unconfirmed','Video posted','Creation date','Pending review','Archived','Entry updated','Pending addition']
};
const q=document.querySelector('#q'),picker=document.querySelector('#lang');
let prefs=navigator.languages||[navigator.language];
try{prefs=[localStorage.getItem('archive-lang'),...prefs]}catch{}
picker.value=prefs.map(v=>v?.split('-')[0]).find(v=>Object.hasOwn(ui,v))||'en';
const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
const pairs='@@HAN@@';
const han=new Map();
for(let i=0;i<pairs.length;i+=2) han.set(pairs[i],pairs[i+1]);
const norm=s=>Array.from(s.normalize('NFKC').toLowerCase(),c=>han.get(c)||c).join('');
const theme=new URLSearchParams(location.search).get('style');
if(['folio','studio','index'].includes(theme))document.body.dataset.style=theme;
const actions={
 zh:['提交新技','纠错或补充','暂无待审更新','技名、作成者及依据','参考视频、时间点或其他来源','建议修改及依据'],
 ja:['新しい技を投稿','訂正・情報提供','確認待ちの更新はありません','技名・作者とその根拠','参考動画・開始位置・その他の出典','訂正内容と根拠'],
 en:['Submit a waza','Suggest a correction','No pending changes','Waza name, creator and supporting evidence','Reference video, timestamp or other source','Suggested change and supporting evidence']
};
function issueUrl(labels,entry){
 const url=new URL('https://github.com/jameslyu916-source/WotaWazaDB/issues/new');
 url.searchParams.set('title',(entry?labels[1]+' · '+entry.name:labels[0]+' · '));
 url.searchParams.set('body',[entry?entry.id+' · '+entry.name:'',entry?labels[5]:labels[3],labels[4]].filter(Boolean).join('\n\n'));
 return url.href;
}
function render(){
 const lang=picker.value,u=ui[lang],intro=u[0]+(review?' · '+u[1]:'');
 const labels=actions[lang],submit=document.querySelector('#submit');
 submit.textContent=labels[0];submit.href=issueUrl(labels);
 document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title='WotaWazaDB · '+intro;
 document.querySelector('#intro').textContent=intro;q.placeholder=u[2];q.setAttribute('aria-label',u[2]);
 const box=document.querySelector('#list'),opened=new Set([...box.querySelectorAll('details[open]')].map(d=>d.id));box.replaceChildren();
 const term=norm(q.value.trim());
 const rows=entries.filter(e=>[e.name,e.reading,...e.aliases,...e.creators].filter(Boolean).some(v=>norm(v).includes(term)));
 document.querySelector('#count').textContent=rows.length?rows.length+' '+(lang==='en'&&rows.length===1?'entry':u[3]):entries.length?u[4]:review?labels[2]:u[5];
 for(const e of rows){
 const d=el('details','');d.id=e.id;d.open=opened.has(e.id)||location.hash==='#'+e.id;
 const s=el('summary','');s.append(el('strong',e.name),el('small',e.creators.join(lang==='en'?', ':'、')||u[6]));d.append(s);
 if(e.reading||e.aliases.length)d.append(el('p',[e.reading,...e.aliases].filter(Boolean).join(' · ')));
 if(e.dictionaryHonke)d.append(el('p',({zh:'辞典所列本家',ja:'辞典の本家表記',en:'Honke credited by the dictionary'})[lang]+' · '+e.dictionaryHonke));
 const links=el('ul','');
 for(const item of [...e.videos,...e.sources]){
 const label=item.labelI18n?.[lang]||item.label;
 const a=el('a',(item.pending?u[12]+' · ':'')+label);a.href=item.url;
 const li=el('li','');li.append(a);if(item.published)li.append(' · '+u[7]+' '+item.published);links.append(li);
 }
 d.append(links);
 if(e.creation)d.append(el('p',u[8]+' '+e.creation.date+' · '+(e.creation.evidenceI18n?.[lang]||e.creation.evidence)));
 d.append(el('p',e.noteI18n?.[lang]||e.note),el('small',e.id+' · '+u[e.status==='pending'?9:10]+' · '+u[11]+' '+e.updated));const edit=el('a',labels[1]);edit.href=issueUrl(labels,e);const footer=el('p','');footer.append(edit);d.append(footer);box.append(d);
 }}
picker.addEventListener('change',()=>{try{localStorage.setItem('archive-lang',picker.value)}catch{}render()});
q.addEventListener('input',render);render();</script></html>
